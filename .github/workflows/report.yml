name: Radar report

on:
  workflow_dispatch:
    inputs:
      action:
        description: Bind the private chat, send or resume a report, or reconcile a delivery
        type: choice
        default: send
        options:
          - send
          - preview
          - weekly-preview
          - resume
          - confirm_received
          - confirm_unsent
          - bind_chat
          - confirm_bind
      report_id:
        description: Date-based report ID or hourly alert ID for recovery
        type: string
      part_no:
        description: Part number for confirmation only
        type: string
  # Stage C (Owner approved 2026-11-26, Issue #16). Runs only while RADAR_STAGE is c-scheduled.
  schedule:
    - cron: '30 0 * * *'
    - cron: '0 1 * * 0'
    # Backups in case GitHub drops a scheduled run; an already-delivered report is not resent.
    - cron: '50 0 * * *'
    - cron: '20 1 * * 0'

permissions:
  contents: read

jobs:
  report:
    if: >-
      github.repository == 'alex20230412-svg/global-trend-radar' &&
      github.ref == 'refs/heads/main' &&
      ((github.event_name == 'workflow_dispatch' &&
      (vars.RADAR_STAGE == 'b-manual' || vars.RADAR_STAGE == 'c-scheduled')) ||
      (github.event_name == 'schedule' && vars.RADAR_STAGE == 'c-scheduled'))
    concurrency:
      group: radar-private-writer
      queue: max
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
    environment: radar-live
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
      - name: Install verified dependencies
        shell: bash
        run: >-
          python -m pip --isolated --disable-pip-version-check install --no-cache-dir
          --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.lock
      - name: Run private radar report
        shell: bash
        env:
          RADAR_STAGE: ${{ vars.RADAR_STAGE }}
          RADAR_APPROVED_SOURCES: ${{ vars.RADAR_APPROVED_SOURCES }}
          RADAR_SCHEDULE_FROM: ${{ vars.RADAR_SCHEDULE_FROM }}
          RUN_METADATA_TOKEN: ${{ github.token }}
          DATA_REPO_TOKEN: ${{ secrets.DATA_REPO_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RADAR_REPORT_ACTION: ${{ inputs.action }}
          RADAR_REPORT_SCHEDULE: ${{ github.event.schedule }}
          RADAR_REPORT_ID: ${{ inputs.report_id }}
          RADAR_PART_NO: ${{ inputs.part_no }}
        run: python -m radar.live report
