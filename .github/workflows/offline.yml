name: Radar offline tests

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    if: github.repository == 'alex20230412-svg/global-trend-radar'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
      - name: Install verified dependencies
        shell: bash
        run: >-
          python -m pip --isolated --disable-pip-version-check install --no-cache-dir
          --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.lock
      - name: Run synthetic and mocked tests
        run: python -m unittest discover -s tests -v
