name: Radar live check

on:
  workflow_dispatch:
    inputs:
      probe_gdelt:
        description: Probe GDELT separately while it is disabled in the digest
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: radar-live-check
  cancel-in-progress: false

jobs:
  check:
    if: github.repository == 'alex20230412-svg/global-trend-radar' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.10'
      - name: Install verified dependencies
        shell: bash
        run: >-
          python -m pip --isolated --disable-pip-version-check install --no-cache-dir
          --index-url https://pypi.org/simple --require-hashes --only-binary=:all: -r requirements.lock
          >/dev/null 2>&1
      - name: Run credential-free source and digest checks
        env:
          RADAR_PROBE_GDELT: ${{ inputs.probe_gdelt }}
          RUN_METADATA_TOKEN: ${{ github.token }}
        run: python -m radar.livecheck
