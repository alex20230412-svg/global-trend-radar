name: Radar keepalive

# GitHub disables scheduled workflows in a public repository after 60 days without activity.
# Re-enabling them through the API resets that clock. Twice a month, without checkout or credentials beyond the job token.
on:
  schedule:
    - cron: '41 3 1,15 * *'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    if: github.repository == 'alex20230412-svg/global-trend-radar' && vars.RADAR_STAGE == 'c-scheduled'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for workflow in collect.yml report.yml keepalive.yml; do
            gh api -X PUT "repos/${GH_REPO}/actions/workflows/${workflow}/enable" >/dev/null
            echo "keepalive workflow=${workflow} outcome=enabled"
          done
